
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotimi Adebari | Business Card</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 750px;
    }

    .card img {
      display: block;
      width: 100%;
      height: auto;
    }

    .linkedin-link {
      position: absolute;
      left: 24%;
      top: 88.5%;
      width: 52%;
      height: 5%;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="business-card.jpg"
         alt="Rotimi Adebari Business Card">

    <a class="linkedin-link"
       href="https://www.linkedin.com/in/rotimiadebari/"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Visit LinkedIn profile">
    </a>
  </div>
</body>
</html>
